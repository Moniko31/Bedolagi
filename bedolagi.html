<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бедолаги и последний пельмень</title>
<meta name="description" content="30-секундный бумажный мультфильм в технике stop-motion со звуком, который синтезируется прямо в браузере. Сделан по промту video-prompt-01.md.">
<style>
:root{--bg:#17100b;--ink:#f6e8cf;--accent:#e08a3c;--panel:rgba(23,16,11,.72)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;place-items:center;overflow:hidden}
#stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:#000;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.6)}
svg{display:block;width:100%;height:100%}
#veil{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:16px;background:radial-gradient(ellipse at center,rgba(23,16,11,.30),rgba(23,16,11,.85));transition:opacity .45s}
#veil.hide{opacity:0;pointer-events:none}
#veil.end{background:linear-gradient(transparent 62%,rgba(0,0,0,.65));place-content:end center;padding-bottom:4%}
#veil.end h1,#veil.end .sub{display:none}
h1{margin:0;font-size:clamp(22px,4.4vw,56px);letter-spacing:.02em;text-shadow:0 3px 0 #7a3b17}
.sub{margin:0;font-size:clamp(13px,1.7vw,20px);opacity:.88;max-width:34em}
button{font:inherit;cursor:pointer;color:#2b1608;background:var(--accent);border:0;border-radius:999px;padding:.65em 1.7em;font-weight:700;font-size:clamp(14px,2vw,22px);box-shadow:0 5px 0 #8a4413}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4413}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#mute{position:absolute;top:12px;right:12px;padding:.4em 1em;font-size:14px;background:var(--panel);color:var(--ink);box-shadow:none;border:1px solid rgba(255,255,255,.22);font-weight:600}
#bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.12)}
#bar i{display:block;height:100%;width:0;background:var(--accent)}
</style>
</head>
<body>
<div id="stage">
<svg id="sv" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Бумажный мультфильм: два бедолаги Гоша и Люся пытаются отобрать друг у друга последний пельмень, а он убегает в мышиную норку">
<defs>
  <filter id="rough" x="0" y="0" width="100%" height="100%">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="7" dy="9" stdDeviation="4" flood-color="#2a1408" flood-opacity=".38"/>
  </filter>
  <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="4" dy="5" stdDeviation="2.5" flood-color="#2a1408" flood-opacity=".4"/>
  </filter>
  <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
    <feColorMatrix values="0 0 0 0 .22  0 0 0 0 .13  0 0 0 0 .06  1.5 0 0 0 -.62"/>
  </filter>
  <filter id="fiber" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.28" numOctaves="3" seed="11"/>
    <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .18  0 0 0 0 .08  1.4 0 0 0 -.62"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0c04" stop-opacity=".55"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#fff2b8" stop-opacity=".75"/>
    <stop offset="100%" stop-color="#fff2b8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="ging" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="#f3e5c8"/>
    <rect width="20" height="40" fill="#c4623a" opacity=".38"/>
    <rect width="40" height="20" fill="#c4623a" opacity=".38"/>
  </pattern>
  <pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="14" height="14" fill="#d8c79a" opacity=".45"/>
    <path d="M0 0H14M0 0V14" stroke="#5d6b3a" stroke-width="2.4" fill="none"/>
  </pattern>
  <clipPath id="holeclip"><rect x="-2000" y="0" width="3405" height="1200"/></clipPath>
</defs>
<g filter="url(#rough)">
  <g id="cam"><g id="bg"></g><g id="dyn"></g></g>
  <g id="fx"></g>
</g>
<rect width="1600" height="900" filter="url(#fiber)" style="mix-blend-mode:multiply" opacity=".5" pointer-events="none"/>
<rect width="1600" height="900" filter="url(#grain)" style="mix-blend-mode:multiply" opacity=".6" pointer-events="none"/>
<rect width="1600" height="900" fill="url(#vig)" pointer-events="none"/>
</svg>
<button id="mute" type="button" aria-pressed="false">Звук: вкл</button>
<div id="veil">
  <h1>Бедолаги и последний пельмень</h1>
  <p class="sub">Бумажный мультфильм, 30 секунд. Рисовка и звук создаются кодом прямо в браузере. Включите звук погромче.</p>
  <button id="go" type="button">▶ Смотреть</button>
</div>
<div id="bar"><i id="barfill"></i></div>
</div>

<script>
"use strict";
/* ============================================================
   Бедолаги и последний пельмень — 30 с, бумажная аппликация
   Картинка: SVG, кадры «на двойках» (12 к/с), дрожание краёв.
   Звук: Web Audio, всё синтезируется (никаких файлов).
   Один источник времени — часы аудио, поэтому звук и кадр совпадают.
   ============================================================ */
const DUR=30;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>t*t*(3-2*t);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ES=(t,a,b)=>sm(seg(t,a,b));
const popE=u=>{const c=1.70158;u-=1;return 1+(c+1)*u*u*u+c*u*u};
const r1=n=>Math.round(n*10)/10;
const D2R=Math.PI/180;
const GROUND=840;

/* ---------- палитра ---------- */
const COL={skin:'#f1d4a9',skin2:'#e2a77a',terra:'#c4623a',terraD:'#a84d2c',mustard:'#e3a93a',green:'#3f7a6a',
  greenD:'#2f5d50',cream:'#f6ecd2',red:'#b83a2e',brown:'#5a3a26',plum:'#7a4a6e',rose:'#b5527a',steel:'#d3d7dc',
  kraft:'#c9a36b',dark:'#1d130d'};
const OUT='stroke="rgba(58,30,12,.55)" stroke-width="3" stroke-linejoin="round"';

/* ---------- мелкие рисовалки (возвращают строки SVG) ---------- */
const rect=(x,y,w,h,r,fill,ex='')=>`<rect x="${r1(x)}" y="${r1(y)}" width="${r1(w)}" height="${r1(h)}" rx="${r}" fill="${fill}" ${OUT} ${ex}/>`;
const circ=(x,y,r,fill,ex='')=>`<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(r)}" fill="${fill}" ${OUT} ${ex}/>`;
const ell=(x,y,rx,ry,fill,ex='')=>`<ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(rx)}" ry="${r1(ry)}" fill="${fill}" ${OUT} ${ex}/>`;
const path=(d,fill,ex='')=>`<path d="${d}" fill="${fill}" ${OUT} ${ex}/>`;
const line=(d,col,w=4,ex='')=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
const star=(x,y,r,fill,ex='')=>{x=r1(x);y=r1(y);const k=r*.14;
  return `<path d="M${x} ${y-r}Q${x+k} ${y-k} ${x+r} ${y}Q${x+k} ${y+k} ${x} ${y+r}Q${x-k} ${y+k} ${x-r} ${y}Q${x-k} ${y-k} ${x} ${y-r}Z" fill="${fill}" ${ex}/>`};
const grp=(tf,inner,ex='')=>`<g transform="${tf}" ${ex}>${inner}</g>`;
const heart=(x,y,s,fill)=>`<path transform="translate(${r1(x)} ${r1(y)}) scale(${r1(s)})" d="M0 12C-22 -4 -14 -22 0 -10C14 -22 22 -4 0 12Z" fill="${fill}" ${OUT}/>`;

/* ---------- лицо ---------- */
function eye(x,y,r,m,lk){
  const c='#2a1a12';
  if(m==='closed') return line(`M${x-r} ${y}Q${x} ${y+r*.8} ${x+r} ${y}`,c,4);
  if(m==='happy')  return line(`M${x-r} ${y+r*.3}Q${x} ${y-r*.9} ${x+r} ${y+r*.3}`,c,4.5);
  if(m==='x')      return line(`M${x-r*.7} ${y-r*.7}L${x+r*.7} ${y+r*.7}M${x+r*.7} ${y-r*.7}L${x-r*.7} ${y+r*.7}`,c,4.5);
  const R=m==='wide'?r*1.22:r, pr=m==='wide'?r*.3:(m==='sparkle'?r*.68:r*.52);
  let s=`<circle cx="${x}" cy="${y}" r="${r1(R)}" fill="#fffaf0" stroke="#5a3a26" stroke-width="2.5"/>`;
  const px=x+lk*(R-pr-1.5);
  s+=`<circle cx="${r1(px)}" cy="${y}" r="${r1(pr)}" fill="${c}"/>`;
  if(m==='sparkle') s+=`<circle cx="${r1(px-pr*.35)}" cy="${r1(y-pr*.35)}" r="${r1(pr*.32)}" fill="#fff"/>`+star(px+pr*.3,y+pr*.35,pr*.4,'#fff');
  return s;
}
function brows(cx,y,sp,m,w=24){
  const t={sad:[6,-7,0],mad:[-7,6,0],up:[-12,-16,-7],calm:[0,-2,0],happy:[0,-4,-9]}[m]||[0,-2,0];
  const [oy,iy,bend]=t;const col='#3a2214';
  const L=cx-sp,R=cx+sp;
  const a=`M${L-w} ${y+oy}Q${L-w*.3} ${y+(oy+iy)/2+bend} ${L+w*.4} ${y+iy}`;
  const b=`M${R+w} ${y+oy}Q${R+w*.3} ${y+(oy+iy)/2+bend} ${R-w*.4} ${y+iy}`;
  return line(a,col,6.5)+line(b,col,6.5);
}
function mouth(x,y,m,w){
  const c='#5a2a1a';
  switch(m){
    case 'smile': return line(`M${x-w} ${y}Q${x} ${y+17} ${x+w} ${y}`,c,4.5);
    case 'grin':  return `<path d="M${x-w} ${y-2}Q${x} ${y+30} ${x+w} ${y-2}Z" fill="#7a2e1c" stroke="${c}" stroke-width="3.5" stroke-linejoin="round"/><path d="M${x-w*.8} ${y+2}Q${x} ${y+11} ${x+w*.8} ${y+2}" stroke="#fff" stroke-width="5" fill="none"/>`;
    case 'o':     return `<ellipse cx="${x}" cy="${y+6}" rx="${r1(w*.6)}" ry="${r1(w*.85)}" fill="#6b2415" stroke="${c}" stroke-width="3"/>`;
    case 'open':  return `<path d="M${x-w*.8} ${y-2}Q${x} ${y+40} ${x+w*.8} ${y-2}Z" fill="#6b2415" stroke="${c}" stroke-width="3.5" stroke-linejoin="round"/><ellipse cx="${x}" cy="${y+16}" rx="${r1(w*.38)}" ry="7" fill="#d9707a"/>`;
    case 'grit':  return line(`M${x-w} ${y}L${x-w/2} ${y+6}L${x} ${y}L${x+w/2} ${y+6}L${x+w} ${y}`,c,4.5);
    case 'sad':   return line(`M${x-w} ${y+6}Q${x} ${y-9} ${x+w} ${y+6}`,c,4.5);
    default:      return line(`M${x-w} ${y+2}L${x+w} ${y+2}`,c,4.5);
  }
}

/* ---------- столовые приборы и рука ---------- */
function utensil(u,y0){
  if(u.k==='fork') return rect(-4,y0,8,72,3,COL.steel)+rect(-15,y0+66,30,12,4,COL.steel)+
    [-15,-3,9].map(x=>rect(x,y0+72,6,28,3,COL.steel)).join('');
  if(u.k==='spoon') return rect(-4,y0,8,70,3,COL.steel)+ell(0,y0+100,22,30,COL.steel)+ell(0,y0+102,13,20,'#b9bec5','stroke="none"');
  if(u.k==='rusk'){
    const s=u.split||0, a=s*12, dx=s*16;
    const half=(sx)=>`<g transform="translate(${r1(sx*dx)} ${y0+22}) rotate(${r1(sx*a)})">`+
      rect(sx<0?-40:0,-18,40,36,9,'#d9a05a')+
      circ(sx<0?-26:12,-6,2.6,'#a8702e','stroke="none"')+circ(sx<0?-12:26,7,2.6,'#a8702e','stroke="none"')+
      `</g>`;
    return half(-1)+half(1);
  }
  return '';
}
function arm(sx,sy,th,len,col,ut){
  const u=ut?(typeof ut==='string'?{k:ut}:ut):null;
  return `<g transform="translate(${sx} ${sy}) rotate(${r1(th)})">`+
    rect(-9,-4,18,len+4,9,col)+
    (u?utensil(u,len):'')+
    circ(0,len,14,COL.skin)+
    circ(0,-1,5,'#c9a24a','stroke="#6b4a1e" stroke-width="2"')+
  `</g>`;
}

/* ---------- Гоша ---------- */
function gosha(o){
  const d=Object.assign({x:300,dir:1,rot:0,lean:0,ph:null,run:false,fr:4,bk:6,ut:null,eyes:'normal',mouth:'sad',brow:'sad',look:.6,sit:false,tail:8,dy:0,glint:0,t:0},o);
  const bob=d.ph!=null?Math.abs(Math.sin(d.ph))*(d.run?12:6):0;
  const sw=d.ph!=null?Math.sin(d.ph)*(d.run?40:26):0;
  const legA=d.sit?[-90,-84]:[sw,-sw];
  let s='';
  [[-20,legA[1],'#37604f'],[20,legA[0],COL.green]].forEach(([hx,a,c])=>{
    s+=grp(`translate(${hx} -116) rotate(${r1(a)})`,rect(-11,-6,22,122,9,c)+rect(-13,98,46,22,10,COL.brown));
  });
  s+=arm(-44,-272,d.bk,118,COL.terraD,null);
  s+=path('M-46 -112L-50 -270Q-50 -296 -24 -296L24 -296Q50 -296 50 -270L46 -112Z',COL.terra);
  s+=rect(-24,-228,34,40,5,'#e8bb6a')+rect(-24,-228,34,40,5,'none','stroke="#7a4a1c" stroke-width="2" stroke-dasharray="5 4"');
  [-254,-214,-176].forEach(y=>s+=circ(27,y,6,'#f3dca0'));
  s+=rect(-48,-146,98,16,4,COL.brown)+rect(-8,-149,16,22,3,'#d7b552');
  /* шарф */
  s+=grp(`translate(26 -288) rotate(${r1(d.tail)})`,rect(-11,0,22,128,6,COL.red)+line('M-11 30H11M-11 62H11M-11 94H11','#f3dca0',5)+
    line('M-8 128v12M0 128v14M8 128v12','#8c2a20',4));
  s+=path('M-36 -302Q0 -282 36 -302L40 -282Q0 -258 -40 -282Z',COL.red)+line('M-24 -290L-22 -272M0 -284V-264M24 -290L22 -272','#f3dca0',5);
  /* голова */
  s+=circ(-52,-352,12,COL.skin2)+circ(52,-352,12,COL.skin2)+circ(0,-350,52,COL.skin);
  s+=circ(0,-338,9,'#e7a373')+circ(-32,-326,8,'#eeab8e','stroke="none" opacity=".6"')+circ(32,-326,8,'#eeab8e','stroke="none" opacity=".6"');
  s+=eye(-19,-352,13,d.eyes,d.look)+eye(19,-352,13,d.eyes,d.look);
  if(d.eyes==='sparkle'){const g=1+Math.sin(d.t*14)*.25;s+=star(-30,-372,10*g,'#fff6c0')+star(32,-370,8*g,'#fff6c0');}
  s+=brows(0,-378,19,d.brow,20);
  s+=mouth(0,-314,d.mouth,16);
  /* шапка не по размеру */
  s+=path('M-54 -410Q-62 -470 -6 -492Q42 -510 86 -474Q96 -440 62 -410Z',COL.green);
  s+=line('M-50 -432L58 -408M-34 -462L74 -438','#e8c25a',8,'opacity=".9"');
  s+=rect(-60,-416,122,30,10,COL.mustard)+line('M-40 -414V-388M-14 -414V-388M12 -414V-388M38 -414V-388','#b98a2a',3);
  const pw=Math.sin((d.ph||0)*2)*5;
  s+=circ(88+pw,-470+Math.abs(pw),17,COL.mustard)+circ(84+pw,-474+Math.abs(pw),4,'#f4d27a','stroke="none"');
  /* передняя рука поверх */
  s+=arm(44,-272,d.fr,130,COL.terraD,d.ut);
  const sy=d.sit?100:0, ly=-Math.abs(d.rot)/85*42;
  return `<g filter="url(#sh)"><g transform="translate(${r1(d.x)} ${r1(GROUND-bob+d.dy+ly)}) rotate(${r1(d.rot+d.lean)}) scale(${d.dir} 1)"><g transform="translate(0 ${sy})">${s}</g></g></g>`;
}

/* ---------- Люся ---------- */
function lyusya(o){
  const d=Object.assign({x:1300,dir:-1,rot:0,lean:0,ph:null,run:false,fr:4,bk:6,ut:null,eyes:'normal',mouth:'smile',brow:'happy',look:.6,sit:false,dy:0,t:0,bag:0},o);
  const bob=d.ph!=null?Math.abs(Math.sin(d.ph))*(d.run?9:5):0;
  const sw=d.ph!=null?Math.sin(d.ph)*(d.run?42:28):0;
  const legA=d.sit?[-90,-86]:[sw,-sw];
  let s='';
  [[-24,legA[1],'#64385a'],[24,legA[0],COL.plum]].forEach(([hx,a,c])=>{
    s+=grp(`translate(${hx} -44) rotate(${r1(a)})`,rect(-10,-4,20,48,8,c)+rect(-12,28,46,20,10,COL.brown));
  });
  s+=arm(-60,-140,d.bk,112,COL.rose,null);
  s+=ell(0,-108,68,74,COL.mustard);
  [[-30,-130],[24,-146],[38,-96],[-44,-86],[0,-100],[-12,-60],[30,-60],[-4,-150]].forEach(([x,y])=>s+=circ(x,y,6.5,'#f7e6b8','stroke="none"'));
  s+=path('M-66 -76Q0 -60 66 -76L60 -62Q0 -46 -60 -62Z',COL.terra);
  /* авоська */
  const bAng=d.bag+(d.ph!=null?Math.sin(d.ph*2)*10:0);
  s+=grp(`translate(-62 -138) rotate(${r1(bAng)})`,
    line('M0 0Q-8 36 0 64','#6b5a2a',4)+
    rect(-6,54,12,12,4,'#8a6a2a')+
    `<ellipse cx="0" cy="104" rx="38" ry="42" fill="url(#mesh)" stroke="#5d6b3a" stroke-width="3"/>`+
    circ(-10,96,13,'#e8872e')+circ(14,112,12,'#e8872e')+ell(4,86,20,10,'#d9a05a')+
    rect(-4,52,7,26,3,'#5a8a4a'));
  /* голова */
  s+=circ(0,-226,48,COL.skin);
  s+=path('M-49 -228Q-52 -282 0 -282Q52 -282 49 -228Q30 -258 0 -256Q-30 -258 -49 -228Z','#6a3f2b');
  s+=circ(0,-290,20,'#6a3f2b')+circ(0,-290,8,'#8a5a3e','stroke="none"')+line('M-18 -276Q0 -268 18 -276','#e3a93a',5);
  s+=circ(-40,-206,9,'#ee9a8a','stroke="none" opacity=".7"')+circ(40,-206,9,'#ee9a8a','stroke="none" opacity=".7"');
  s+=`<circle cx="-23" cy="-228" r="24" fill="#fff" fill-opacity=".38" stroke="#3a2214" stroke-width="5"/><circle cx="23" cy="-228" r="24" fill="#fff" fill-opacity=".38" stroke="#3a2214" stroke-width="5"/>`+
     line('M-1 -230Q0 -236 1 -230','#3a2214',4)+line('M-47 -232L-52 -236M47 -232L52 -236','#3a2214',4);
  s+=eye(-23,-228,11.5,d.eyes,d.look)+eye(23,-228,11.5,d.eyes,d.look);
  if(d.eyes==='sparkle'){const g=1+Math.sin(d.t*14+1)*.25;s+=star(-34,-246,10*g,'#fff6c0')+star(36,-244,8*g,'#fff6c0');}
  s+=brows(0,-264,23,d.brow,19);
  s+=mouth(0,-196,d.mouth,15);
  s+=arm(58,-140,d.fr,140,COL.rose,d.ut);
  const sy=d.sit?36:0, ly=-Math.abs(d.rot)/80*30;
  return `<g filter="url(#sh)"><g transform="translate(${r1(d.x)} ${r1(GROUND-bob+d.dy+ly)}) rotate(${r1(d.rot+d.lean)}) scale(${d.dir} 1)"><g transform="translate(0 ${sy})">${s}</g></g></g>`;
}

/* ---------- пельмень ---------- */
function dumplingSVG(x,y,rot,sx,sy,mood,tw){
  let s=`<path d="M-42 12Q-46 -32 0 -38Q46 -32 42 12Q0 30 -42 12Z" fill="#fbf1da" ${OUT}/>`;
  for(let i=0;i<7;i++){const a=(-160+i*23)*D2R;const x1=Math.cos(a)*40,y1=Math.sin(a)*46-6;
    s+=line(`M${r1(x1)} ${r1(y1)}L${r1(x1*.78)} ${r1(y1*.78+2)}`,'#cdb386',3);}
  s+=`<path d="M-30 -14Q-26 -28 -6 -31" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"/>`;

  CLASH.slice(1).forEach((tc,i)=>{clink(T(tc),.2+.04*Math.sin(i*1.9),2100+i%4*330,(i%2?.15:-.15));});
  for(let i=0;i<9;i++) squeak(T(10.25+i*.5),.03,1200+(i%3)*160);
  /* 15–21: погоня и кувырок */
  boing(T(15),.22,520);
  thud(T(15.8),.16);
  loopNoise(T(15.8),5,.07,'lowpass',280,1,6,.03);
  for(let i=0;i<26;i++){const n=[69,71,72,74,76,74,72,71][i%8]+(i>=8&&i<16?0:i>=16?12:5);pluck(T(15+i*.125),mf(n),.13,.12,(i%2?.3:-.3),.15);}
  for(let i=0;i<7;i++){if(i%2===0)bassN(T(15+i*.5),mf(i%4?52:45),.26,.2);else[57,60,64].forEach(n=>pluck(T(15+i*.5),mf(n),.1,.1,0,.1));}
  stepTimes(gPos,19,16,18.3).forEach(t=>footstep(T(t),.12,-.3));
  stepTimes(lPos,12,16,18.3).forEach(t=>footstep(T(t),.1,.3));
  thud(T(18.3),.5);noiseHit(T(18.3),.6,.14,'highpass',3000,5000,1,0,.2);
  [18.34,18.42,18.55].forEach((t,i)=>clink(T(t),.16,1500+i*410,i%2?.4:-.4));
  slide(T(18.4),1500,180,.8,.14);
  const dz=[84,83,81,80,78,77,75,74];
  dz.forEach((n,i)=>bell(T(19+i*.28),mf(n),.09,1.2,Math.sin(i)*.4));
  boing(T(21),.2,360);pop(T(21.5),.16);
  /* 21–25: мышка */
  squeak(T(22.0),.1,2600);squeak(T(22.5),.07,2200);squeak(T(22.8),.07,2400);
  seq(21,.25,[57,null,58,null,59,null,null,null,57,null,58,null,59,null,60,null,null,null,64,null,63,null,62,null,null,null,null,null],(t,n)=>pluck(t,mf(n),.17,.12,.1,.15));
  for(let i=0;i<8;i++) bassN(T(21+i*.5),mf(i%2?45:40),.18,.14);
  noiseHit(T(23.25),.08,.1,'highpass',3000,5000,1,.3,.05);
  slide(T(23.3),500,1400,.55,.08,'triangle');
  pop(T(23.9),.28,.4);noiseHit(T(23.9),.05,.1,'highpass',4000,7000,1,0,.1);
  [43,50,55,58,61].forEach(n=>{const g=envG(T(24),.01,.07,.5),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;lp.connect(g);osc('sawtooth',mf(n),T(24),.5,lp);out(g,0,.3)});
  thud(T(24),.35);
  /* бумажные шторки */
  whoosh(T(24.55),.9,.2,400,3500);whoosh(T(27.15),.9,.2,400,3500);
  /* 25–30: тёплый финал */
  [[25,76],[25.5,79],[26,84],[26.5,79],[27,77],[27.5,81],[28,86],[28.5,81]].forEach(([t,n])=>bell(T(t),mf(n),.1,1.6,Math.sin(t)*.3));
  [[25,48],[27,53]].forEach(([t,n])=>[0,7,12].forEach((iv,i)=>{const g=AC.createGain();g.gain.setValueAtTime(.0001,T(t));g.gain.linearRampToValueAtTime(.05,T(t)+.6);g.gain.linearRampToValueAtTime(.0001,T(t)+2.3);osc('sine',mf(n+iv),T(t),2.3,g);out(g,0,.3);}));
  noiseHit(T(26.9),.05,.28,'highpass',1800,3000,1,0,.05);noiseHit(T(26.93),.04,.2,'highpass',3500,5000,1,0,.05);
  [28.0,28.25,28.5].forEach((t,i)=>bell(T(t),mf(91+i*4),.06,1.2,.2));
  [72,76,79,84,88].forEach((n,i)=>bell(T(29+i*.06),mf(n),.12,3.4,(i-2)*.2));
  bassN(T(29),mf(36),.3,1.6);
  'БЕДОЛАГИ'.split('').forEach((_,i)=>{pop(T(29.3+i*.06),.06,(i-3.5)*.12);});
  bell(T(29.45),mf(96),.1,2.6);
}

/* ---------- плеер ---------- */
const dyn=$('dyn'),camG=$('cam'),fx=$('fx'),turb=$('turb'),veil=$('veil'),barfill=$('barfill'),muteBtn=$('mute');
$('bg').innerHTML=bgSVG();
let playing=false,raf=0,lastKey=-1,lastCamKey=-1;
function render(t){
  t=clamp(t,0,DUR);
  const tf=Math.floor((t+.04)*12)/12;
  const tc=Math.floor((t+.02)*24)/24;
  const c=camera(tc);
  camG.setAttribute('transform',`translate(800 450) scale(${r1(c.s*1000)/1000}) translate(${r1(-c.x)} ${r1(-c.y)})`);
  turb.setAttribute('seed',String(1+Math.floor(t*12)%6));
  dyn.innerHTML=scene(tf);
  fx.innerHTML=overlay(tc);
}
function loop(){
  if(!playing)return;
  const t=AC.currentTime-base;
  const key=Math.floor((t+.02)*24);
  if(key!==lastKey){lastKey=key;render(t);}
  barfill.style.width=(clamp(t/DUR)*100)+'%';
  if(t>=DUR+.4){playing=false;finish();return;}
  raf=requestAnimationFrame(loop);
}
function finish(){
  render(DUR);barfill.style.width='100%';
  $('go').textContent='↻ Ещё раз';
  veil.classList.remove('hide');veil.classList.add('end');
}
function start(){
  cancelAnimationFrame(raf);
  if(AC){try{AC.close()}catch(e){}AC=null;}
  const ok=audioInit();
  if(ok){
    const go=()=>{base=AC.currentTime+.25;scheduleAudio();playing=true;lastKey=-1;veil.classList.add('hide');veil.classList.remove('end');raf=requestAnimationFrame(loop);};
    if(AC.state==='suspended'){AC.resume().then(go,go);}else go();
  }else{
    /* без звука: часы страницы */
    const t0=performance.now()+250;
    const fake={get currentTime(){return performance.now()/1000}};
    AC=fake;base=t0/1000;playing=true;lastKey=-1;veil.classList.add('hide');veil.classList.remove('end');raf=requestAnimationFrame(loop);
  }
}
$('go').addEventListener('click',start);
muteBtn.addEventListener('click',()=>{
  muted=!muted;muteBtn.textContent='Звук: '+(muted?'выкл':'вкл');muteBtn.setAttribute('aria-pressed',String(muted));
  if(master)master.gain.setTargetAtTime(muted?0:.9,AC.currentTime,.03);
});
window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!playing&&document.activeElement!==muteBtn){e.preventDefault();start();}});
render(4.3);
</script>
